<!doctype html><html><head><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-title' content='Route Entry'><title>UK Route Entry</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17202a}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding:calc(22px + env(safe-area-inset-top)) 20px 30px}.head{margin-bottom:22px}.head h1{font-size:27px;margin:0 0 5px}.head p{margin:0;color:#667085;font-size:14px}.field{margin:16px 0}label{font-weight:650;font-size:14px;display:block;margin-bottom:7px}input,select{width:100%;font-size:17px;padding:13px 12px;border:1px solid #cfd5dd;border-radius:11px;background:#fff;min-height:50px}.refs{display:grid;gap:9px}.add{width:100%;border:1px dashed #7b8794;background:#f8fafc;border-radius:11px;padding:12px;font-size:15px;font-weight:650}.submit{width:100%;border:0;background:#111827;color:#fff;border-radius:12px;padding:15px;font-size:17px;font-weight:700;margin-top:22px}.status{display:none;margin-top:15px;padding:12px;border-radius:10px;background:#ecfdf3;color:#027a48;font-weight:600}.note{font-size:12px;color:#667085;margin-top:18px;line-height:1.4}.remove{border:0;background:transparent;color:#b42318;font-size:13px;margin-top:-4px;text-align:right}.row{display:flex;gap:8px}.row input{flex:1}</style></head><body><main class='app'><div class='head'><h1>UK Route Entry</h1><p>Enter route details for the weekly workbook</p></div><form id='f'><div class='field'><label>Date</label><input id='date' type='date' required></div><div class='field'><label>Driver</label><select id='driver' required><option value=''>Select driver…</option><option>Ali Syed</option><option>Andy Lock</option><option>Chris Mackenzie</option><option>Faye Etherington</option><option>Manjinder</option><option>Manpreet</option><option>Marcio</option><option>Mark Etherington</option><option>Martin Ford</option><option>Maurice Jacobs</option><option>Navjot Singh</option><option>Scott Austin</option><option>Steve Jacobs</option><option>Usman</option></select></div><div class='field'><label>Route Leg No.</label><input id='leg' inputmode='text' autocomplete='off' required placeholder='Enter route leg number'></div><div class='field'><label>References</label><div id='refs' class='refs'><input class='ref' autocomplete='off' placeholder='Reference 1' required></div></div><button class='add' type='button' id='add'>＋ Add Reference</button><div class='field'><label>Area</label><input id='area' autocomplete='off' required placeholder='Enter area'></div><button class='submit' type='submit'>Submit Entry</button><div id='status' class='status'>✓ Entry prepared successfully</div></form><div class='note'>Miles is deliberately excluded and will not be changed. In the connected version, references are written to one Excel cell separated by line breaks.</div></main><script>const d=document.getElementById('date');d.value=new Date().toLocaleDateString('en-CA');const refs=document.getElementById('refs');document.getElementById('add').onclick=()=>{const n=refs.querySelectorAll('.ref').length+1;const wrap=document.createElement('div');wrap.className='row';wrap.innerHTML=`<input class="ref" autocomplete="off" placeholder="Reference ${n}" required><button class="remove" type="button">✕</button>`;wrap.querySelector('.remove').onclick=()=>wrap.remove();refs.appendChild(wrap);wrap.querySelector('input').focus()};document.getElementById('f').onsubmit=e=>{e.preventDefault();const payload={date:d.value,driver:document.getElementById('driver').value,routeLeg:document.getElementById('leg').value.trim(),ref:[...document.querySelectorAll('.ref')].map(x=>x.value.trim()).filter(Boolean).join('\n'),area:document.getElementById('area').value.trim()};localStorage.setItem('lastRouteEntry',JSON.stringify(payload));document.getElementById('status').style.display='block';document.getElementById('leg').value='';document.getElementById('area').value='';refs.innerHTML='<input class="ref" autocomplete="off" placeholder="Reference 1" required>';setTimeout(()=>document.getElementById('status').style.display='none',3000)};</script></body></html>
