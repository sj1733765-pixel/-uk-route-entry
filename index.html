<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>UK Route Entry</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fa;margin:0;color:#172033}.wrap{max-width:520px;margin:auto;padding:22px 16px 50px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}h1{margin:0 0 6px;font-size:28px}p{color:#5d687a;margin-top:4px}.status{padding:12px;border-radius:10px;background:#eef3f8;margin:14px 0;font-size:14px}.ok{background:#e9f8ee;color:#176b36}.err{background:#fdecec;color:#9b1c1c}label{display:block;font-weight:650;margin:15px 0 6px}input,select{box-sizing:border-box;width:100%;font-size:17px;padding:13px;border:1px solid #c8d0da;border-radius:10px;background:white}button{font-size:17px;font-weight:700;border:0;border-radius:11px;padding:14px 16px;width:100%;margin-top:14px;background:#1769e0;color:white}.secondary{background:#edf3fb;color:#1557aa}.danger{background:#fff0f0;color:#a41f1f}.refrow{display:flex;gap:8px;align-items:center;margin-top:8px}.refrow input{flex:1}.refrow button{width:48px;margin:0;padding:13px 5px;background:#f3f4f6;color:#555}.small{font-size:12px;color:#6b7280}.hidden{display:none}</style>
<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head>
<body><div class="wrap"><div class="card"><h1>UK Route Entry</h1><p>Enter route details and save them to your OneDrive workbook.</p><div id="status" class="status">Sign in to Microsoft to begin.</div><button id="signin" disabled>Preparing Microsoft sign-in…</button><button id="signout" class="danger hidden">Sign out</button>
<div id="form" class="hidden"><label>Date</label><input id="date" type="date"><label>Driver</label><select id="driver"></select><label>Route Leg No.</label><input id="leg" autocomplete="off"><label>References</label><div id="refs"></div><button id="addref" type="button" class="secondary">+ Add Reference</button><label>Area</label><input id="area" autocomplete="off">
<button id="submit" type="button">Submit Entry</button>
<p class="small">Miles is never changed. Multiple references are stored in the same Ref cell on separate lines.</p></div></div></div>
<script>
const CLIENT_ID='7e2cebf4-5386-4917-b433-a19b7ab74a84';
const REDIRECT_URI='https://sj1733765-pixel.github.io/-uk-route-entry/';
const FILE_NAME='UK WE 04.10.26.xlsx'; const SHARE_URL='https://1drv.ms/x/c/24bc7540fc44b24e/IQAmEhMq1EcqTo-xJwzAPYBRAWCqy9kaG3rcXopYhmHhZdk'; const SHEET_NAME='HAWB & Postcodes';
const drivers=['Ali Syed','Andy Lock','Chris Mackenzie','Faye Etherington','Manjinder','Manpreet','Marcio','Mark Etherington','Martin Ford','Maurice Jacobs','Navjot Singh','Scott Austin','Steve Jacobs','Usman'];
const msalApp=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:'https://login.microsoftonline.com/common',redirectUri:REDIRECT_URI},cache:{cacheLocation:'localStorage'}});
const scopes=['User.Read','Files.ReadWrite']; let account=null;
const $=id=>document.getElementById(id); function status(msg,kind=''){let e=$('status');e.textContent=msg;e.className='status '+kind}
function addRef(v=''){let d=document.createElement('div');d.className='refrow';d.innerHTML='<input class="ref" placeholder="Reference" autocomplete="off"><button type="button">×</button>';d.querySelector('input').value=v;d.querySelector('button').onclick=()=>{if(document.querySelectorAll('.ref').length>1)d.remove()};$('refs').appendChild(d)}
function initForm(){ $('driver').innerHTML=drivers.map(x=>`<option>${x}</option>`).join(''); let t=new Date(); $('date').value=[t.getFullYear(),String(t.getMonth()+1).padStart(2,'0'),String(t.getDate()).padStart(2,'0')].join('-'); if(!$('refs').children.length)addRef(); }
function signedIn(a){account=a;$('signin').classList.add('hidden');$('signout').classList.remove('hidden');$('form').classList.remove('hidden');initForm();status('Signed in. Ready to enter route details.','ok')}
async function token(){try{return (await msalApp.acquireTokenSilent({account,scopes})).accessToken}catch(e){status('Microsoft needs you to sign in again. Redirecting…');await msalApp.acquireTokenRedirect({account,scopes,redirectUri:REDIRECT_URI});throw new Error('Redirecting to Microsoft sign-in…')}}
$('signin').onclick=async()=>{try{status('Opening Microsoft sign-in…');await msalApp.loginRedirect({scopes,redirectUri:REDIRECT_URI,prompt:'select_account'})}catch(e){status('Sign-in failed: '+(e.message||e),'err')}};
$('signout').onclick=()=>msalApp.logoutRedirect({account}); $('addref').onclick=()=>addRef();
function col(n){let s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}

function shareToken(url){
  const bytes=new TextEncoder().encode(url);
  let bin='';
  bytes.forEach(b=>bin+=String.fromCharCode(b));
  return 'u!'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function findSharedWorkbook(tok){
  const encoded=shareToken(SHARE_URL);
  const r=await fetch('https://graph.microsoft.com/v1.0/shares/'+encoded+'/driveItem',{
    headers:{Authorization:'Bearer '+tok}
  });
  if(!r.ok){
    let detail='';
    try{detail=await r.text();}catch(_){}
    throw new Error('Microsoft Graph could not open the shared workbook ('+r.status+'). '+detail.slice(0,180));
  }
  const item=await r.json();
  if(!item || !item.id) throw new Error('The OneDrive share link did not resolve to a workbook.');
  return item;
}

function excelSerialToDate(n){let d=new Date(Date.UTC(1899,11,30)+Number(n)*86400000);return d.toISOString().slice(0,10)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function cellMap(xml){let map={};for(let m of xml.matchAll(/<c\b[^>]*\br="([A-Z]+\d+)"[^>]*>[\s\S]*?<\/c>|<c\b[^>]*\br="([A-Z]+\d+)"[^>]*\/>/g)){let ref=m[1]||m[2];map[ref]=m[0]}return map}
function cellValue(c,shared){if(!c)return'';let t=(c.match(/\bt="([^"]+)"/)||[])[1];if(t==='inlineStr'){let z=(c.match(/<t[^>]*>([\s\S]*?)<\/t>/)||[])[1];return z?decode(z):''}let v=(c.match(/<v>([\s\S]*?)<\/v>/)||[])[1];if(v==null)return'';return t==='s'?(shared[+v]||''):decode(v)}
function decode(s){let d=document.createElement('textarea');d.innerHTML=s;return d.value}
function setInline(xml,ref,value){let newc=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(value)}</t></is></c>`;let re=new RegExp(`<c\\b[^>]*\\br="${ref}"[^>]*>[\\s\\S]*?<\\/c>|<c\\b[^>]*\\br="${ref}"[^>]*/>`);if(re.test(xml))return xml.replace(re,newc);let row=ref.match(/\d+/)[0], rr=new RegExp(`(<row\\b[^>]*\\br="${row}"[^>]*>)([\\s\\S]*?)(<\\/row>)`);return xml.replace(rr,(all,a,b,c)=>a+b+newc+c)}
async function findFile(tok){let q=encodeURIComponent(FILE_NAME);let r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/root/search(q='${q}')?$select=id,name,parentReference,lastModifiedDateTime`,{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw new Error('Could not search OneDrive ('+r.status+')');let j=await r.json();let x=j.value.find(v=>v.name===FILE_NAME);if(!x)throw new Error('Workbook not found in OneDrive: '+FILE_NAME);return x}

async function inspectWorksheet(tok,file,date,driver){
  const driveId=file.parentReference && file.parentReference.driveId;
  if(!driveId) throw new Error('OneDrive did not return the workbook drive ID.');
  const r=await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${file.id}/content`,{
    headers:{Authorization:'Bearer '+tok}
  });
  if(!r.ok) throw new Error('Could not read workbook ('+r.status+').');
  const buf=await r.arrayBuffer();
  const zip=await JSZip.loadAsync(buf);

  const wb=await zip.file('xl/workbook.xml').async('string');
  const rel=await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const sheet=[...wb.matchAll(/<sheet\b[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)]
    .find(x=>decode(x[1])===SHEET_NAME);
  if(!sheet) throw new Error('Worksheet "'+SHEET_NAME+'" was not found.');

  const relationship=[...rel.matchAll(/<Relationship\b[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)]
    .find(x=>x[1]===sheet[2]);
  if(!relationship) throw new Error('Worksheet relationship could not be read.');

  let target=relationship[2].replace(/^\//,'');
  if(!target.startsWith('xl/')) target='xl/'+target.replace(/^\.\//,'');
  const sx=await zip.file(target).async('string');

  let shared=[];
  if(zip.file('xl/sharedStrings.xml')){
    const sh=await zip.file('xl/sharedStrings.xml').async('string');
    for(const si of sh.matchAll(/<si>([\s\S]*?)<\/si>/g)){
      shared.push([...si[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)]
        .map(x=>decode(x[1])).join(''));
    }
  }

  const cm=cellMap(sx);
  const rows=[...sx.matchAll(/<row\b[^>]*\br="(\d+)"[^>]*>/g)].map(x=>+x[1]);
  let currentDate=null, matching=[], available=[];
  for(const row of rows){
    const av=cellValue(cm['A'+row],shared);
    if(av){
      const n=Number(av);
      if(Number.isFinite(n)) currentDate=excelSerialToDate(n);
      else {
        const parsed=new Date(av);
        if(!isNaN(parsed)) currentDate=parsed.toISOString().slice(0,10);
      }
    }
    const dv=cellValue(cm['B'+row],shared).trim();
    if(currentDate===date && dv===driver){
      matching.push(row);
      if(!cellValue(cm['C'+row],shared).trim() &&
         !cellValue(cm['D'+row],shared).trim() &&
         !cellValue(cm['E'+row],shared).trim()) available.push(row);
    }
  }
  return {matching,available};
}

async function updateWorkbook(tok,file,date,driver,leg,refs,area){let itemId=file.id,driveId=file.parentReference&&file.parentReference.driveId;if(!driveId)throw new Error('OneDrive did not return the workbook drive ID.');let r=await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/content`,{headers:{Authorization:'Bearer '+tok}});if(!r.ok)throw new Error('Could not download workbook ('+r.status+')');let buf=await r.arrayBuffer(), zip=await JSZip.loadAsync(buf);let wbxml=await zip.file('xl/workbook.xml').async('string'), relxml=await zip.file('xl/_rels/workbook.xml.rels').async('string');let sm=[...wbxml.matchAll(/<sheet\b[^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g)].find(x=>decode(x[1])===SHEET_NAME);if(!sm)throw new Error('Worksheet not found');let rid=sm[2];let rm=[...relxml.matchAll(/<Relationship\b[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)].find(x=>x[1]===rid);if(!rm)throw new Error('Worksheet relationship not found');let target=rm[2].replace(/^\//,'');if(!target.startsWith('xl/'))target='xl/'+target.replace(/^\.\//,'');let sx=await zip.file(target).async('string');let shared=[];if(zip.file('xl/sharedStrings.xml')){let sh=await zip.file('xl/sharedStrings.xml').async('string');for(let si of sh.matchAll(/<si>([\s\S]*?)<\/si>/g)){let txt=[...si[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>decode(x[1])).join('');shared.push(txt)}}let cm=cellMap(sx), currentDate=null, candidates=[];let rows=[...sx.matchAll(/<row\b[^>]*\br="(\d+)"[^>]*>/g)].map(x=>+x[1]);for(let row of rows){let av=cellValue(cm['A'+row],shared);if(av){let num=parseFloat(av);if(!isNaN(num))currentDate=excelSerialToDate(num)}let dv=cellValue(cm['B'+row],shared).trim();if(currentDate===date&&dv===driver.trim())candidates.push(row)}if(!candidates.length)throw new Error(`No row found for ${driver} on ${date}`);let chosen=candidates.find(row=>!cellValue(cm['C'+row],shared)&&!cellValue(cm['D'+row],shared)&&!cellValue(cm['E'+row],shared));if(!chosen)throw new Error(`No empty rows available for ${driver} on ${date}`);sx=setInline(sx,'C'+chosen,leg);sx=setInline(sx,'D'+chosen,refs.join('\n'));sx=setInline(sx,'E'+chosen,area);zip.file(target,sx);let out=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});let up=await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${itemId}/content`,{method:'PUT',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:out});if(!up.ok)throw new Error('Could not save workbook ('+up.status+')');return chosen}


$('submit').onclick=async()=>{let date=$('date').value,driver=$('driver').value,leg=$('leg').value.trim(),area=$('area').value.trim(),refs=[...document.querySelectorAll('.ref')].map(x=>x.value.trim()).filter(Boolean);if(!date||!driver||!leg||!area||!refs.length){status('Please complete Date, Driver, Route Leg No., at least one Reference, and Area.','err');return}try{$('submit').disabled=true;status('Saving to OneDrive…');let tok=await token(),file=await findSharedWorkbook(tok),row=await updateWorkbook(tok,file,date,driver,leg,refs,area);status(`Saved successfully to row ${row}.`,'ok');$('leg').value='';$('area').value='';$('refs').innerHTML='';addRef()}catch(e){console.error(e);status(e.message||String(e),'err')}finally{$('submit').disabled=false}};
(async()=>{try{await msalApp.initialize();let rr=await msalApp.handleRedirectPromise();account=rr?.account||msalApp.getAllAccounts()[0];if(account){signedIn(account)}else{$('signin').disabled=false;$('signin').textContent='Sign in with Microsoft';status('Ready. Sign in to Microsoft to begin.')}}catch(e){$('signin').disabled=false;$('signin').textContent='Sign in with Microsoft';status('Authentication setup error: '+(e.message||e),'err')}})();
</script></body></html>
