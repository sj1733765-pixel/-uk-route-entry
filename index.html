<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UK Route Entry</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fa;margin:0;color:#172033}
.wrap{max-width:520px;margin:auto;padding:22px 16px 50px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px #0001}
h1{margin:0 0 6px;font-size:28px}p{color:#5d687a;margin-top:4px}
.status{padding:12px;border-radius:10px;background:#eef3f8;margin:14px 0;font-size:14px}
.ok{background:#e9f8ee;color:#176b36}.err{background:#fdecec;color:#9b1c1c}
label{display:block;font-weight:650;margin:15px 0 6px}
input,select{box-sizing:border-box;width:100%;font-size:17px;padding:13px;border:1px solid #c8d0da;border-radius:10px;background:white}
button{font-size:17px;font-weight:700;border:0;border-radius:11px;padding:14px 16px;width:100%;margin-top:14px;background:#1769e0;color:white}
.secondary{background:#edf3fb;color:#1557aa}.danger{background:#fff0f0;color:#a41f1f}
.multirow{display:flex;gap:8px;align-items:center;margin-top:8px}.multirow input{flex:1}
.multirow button{width:48px;margin:0;padding:13px 5px;background:#f3f4f6;color:#555}
.small{font-size:12px;color:#6b7280}.hidden{display:none}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="wrap"><div class="card">
<h1>UK Route Entry</h1>
<p>Enter route details and save them to your Google Sheet.</p>
<div id="status" class="status">Preparing Google sign-in…</div>
<button id="signin" disabled>Preparing Google sign-in…</button>
<button id="signout" class="danger hidden">Sign out</button>

<div id="form" class="hidden">
<label>Date</label><input id="date" type="date">
<label>Driver</label><select id="driver"></select>
<label>Route Leg No.</label><input id="leg" autocomplete="off">

<label>References</label><div id="refs"></div>
<button id="addref" type="button" class="secondary">+ Add Reference</button>

<label>Area</label><div id="areas"></div>
<button id="addarea" type="button" class="secondary">+ Add Area</button>

<button id="submit" type="button">Submit Entry</button>
</div>
</div></div>

<script>
const CLIENT_ID='535987291861-va8h122a0c17gkv8r1p2hankj3krslt6.apps.googleusercontent.com';
const SPREADSHEET_ID='1_BnkVqgx04tR-bfKG6yho0hRl4QPfryMjhXEJQRF2G4';
const SHEET_NAME='HAWB & Postcodes';
const SCOPE='https://www.googleapis.com/auth/spreadsheets';
const drivers=['Ali Syed','Andy Lock','Chris Mackenzie','Faye Etherington','Manjinder','Manpreet','Marcio','Mark Etherington','Martin Ford','Maurice Jacobs','Navjot Singh','Scott Austin','Steve Jacobs','Usman'];

let tokenClient=null, accessToken=null, pendingResolve=null, pendingReject=null;
const $=id=>document.getElementById(id);
function status(msg,kind=''){const e=$('status');e.textContent=msg;e.className='status '+kind}
function todayLocal(){const t=new Date();return [t.getFullYear(),String(t.getMonth()+1).padStart(2,'0'),String(t.getDate()).padStart(2,'0')].join('-')}
function addMulti(containerId, cls, placeholder, value=''){
  const d=document.createElement('div'); d.className='multirow';
  d.innerHTML=`<input class="${cls}" placeholder="${placeholder}" autocomplete="off"><button type="button">×</button>`;
  d.querySelector('input').value=value;
  d.querySelector('button').onclick=()=>{if(document.querySelectorAll('.'+cls).length>1)d.remove()};
  $(containerId).appendChild(d);
}
function initForm(){
  $('driver').innerHTML=drivers.map(x=>`<option>${x}</option>`).join('');
  $('date').value=todayLocal();
  if(!$('refs').children.length)addMulti('refs','ref','Reference');
  if(!$('areas').children.length)addMulti('areas','area','Area');
}
function showSignedIn(){
  $('signin').classList.add('hidden'); $('signout').classList.remove('hidden'); $('form').classList.remove('hidden');
  initForm(); status('Signed in. Ready to enter route details.','ok');
}
function waitForGoogle(){
  if(window.google?.accounts?.oauth2){
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID, scope:SCOPE,
      callback:(resp)=>{
        if(resp.error){ if(pendingReject)pendingReject(new Error(resp.error_description||resp.error)); return; }
        accessToken=resp.access_token; showSignedIn();
        if(pendingResolve)pendingResolve(accessToken);
        pendingResolve=pendingReject=null;
      }
    });
    $('signin').disabled=false; $('signin').textContent='Sign in with Google';
    status('Ready. Sign in with Google to begin.');
  }else setTimeout(waitForGoogle,200);
}
function getToken(){
  if(accessToken)return Promise.resolve(accessToken);
  return new Promise((resolve,reject)=>{
    pendingResolve=resolve; pendingReject=reject;
    tokenClient.requestAccessToken({prompt:''});
  });
}
$('signin').onclick=()=>tokenClient.requestAccessToken({prompt:'consent'});
$('signout').onclick=()=>{
  if(accessToken && google?.accounts?.oauth2) google.accounts.oauth2.revoke(accessToken,()=>{});
  accessToken=null; $('form').classList.add('hidden'); $('signout').classList.add('hidden'); $('signin').classList.remove('hidden');
  status('Signed out.'); 
};
$('addref').onclick=()=>addMulti('refs','ref','Reference');
$('addarea').onclick=()=>addMulti('areas','area','Area');

function serialToISO(n){
  const d=new Date(Date.UTC(1899,11,30)+Number(n)*86400000);
  return d.toISOString().slice(0,10);
}
function normaliseDate(v){
  if(v===null||v===undefined||v==='')return '';
  if(typeof v==='number' || (/^\d+(\.\d+)?$/.test(String(v).trim()) && Number(v)>30000)) return serialToISO(Number(v));
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const d=new Date(s); return isNaN(d)?'':d.toISOString().slice(0,10);
}
async function api(path, options={}){
  const tok=await getToken();
  const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SPREADSHEET_ID+path,{
    ...options, headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json',...(options.headers||{})}
  });
  if(!r.ok){
    let detail=''; try{const j=await r.json();detail=j?.error?.message||JSON.stringify(j)}catch(_){detail=await r.text()}
    if(r.status===401){accessToken=null}
    throw new Error(`Google Sheets error (${r.status}): ${detail}`);
  }
  return r.json();
}
async function inspect(date,driver){
  const range=encodeURIComponent(`'${SHEET_NAME}'!A:F`);
  const j=await api(`/values/${range}?majorDimension=ROWS&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
  const rows=j.values||[];
  let currentDate='', matching=[], available=[];
  for(let i=0;i<rows.length;i++){
    const row=rows[i], sheetRow=i+1;
    if(row[0]!==undefined && row[0]!==null && row[0]!=='') currentDate=normaliseDate(row[0]);
    const dv=String(row[1]??'').trim();
    if(currentDate===date && dv===driver){
      matching.push(sheetRow);
      const c=String(row[2]??'').trim(), d=String(row[3]??'').trim(), e=String(row[4]??'').trim();
      if(!c&&!d&&!e)available.push(sheetRow);
    }
  }
  return {matching,available};
}

function valuesOf(cls){
  return [...document.querySelectorAll('.'+cls)].map(x=>x.value.trim()).filter(Boolean);
}
function resetEntryFields(){
  $('leg').value='';
  $('refs').innerHTML=''; addMulti('refs','ref','Reference');
  $('areas').innerHTML=''; addMulti('areas','area','Area');
}
async function writeEntry(sheetRow, leg, refs, areas){
  // One request, limited strictly to C:E. Column F (Miles) is never included.
  const range=encodeURIComponent(`'${SHEET_NAME}'!C${sheetRow}:E${sheetRow}`);
  const body={
    range:`'${SHEET_NAME}'!C${sheetRow}:E${sheetRow}`,
    majorDimension:'ROWS',
    values:[[leg, refs.join('\n'), areas.join('\n')]]
  };
  return api(`/values/${range}?valueInputOption=RAW`,{
    method:'PUT',
    body:JSON.stringify(body)
  });
}
$('submit').onclick=async()=>{
  const date=$('date').value;
  const driver=$('driver').value;
  const leg=$('leg').value.trim();
  const refs=valuesOf('ref');
  const areas=valuesOf('area');

  if(!date){status('Choose a date first.','err');return}
  if(!driver){status('Choose a driver first.','err');return}
  if(!leg){status('Enter the Route Leg No.','err');return}
  if(!refs.length){status('Enter at least one Reference.','err');return}
  if(!areas.length){status('Enter at least one Area.','err');return}

  try{
    $('submit').disabled=true;
    status(`Checking the next empty row for ${driver}…`);

    // Re-read immediately before writing so an occupied row is never deliberately overwritten.
    const result=await inspect(date,driver);
    if(!result.matching.length){
      status(`No rows were found for ${driver} on ${date}. Nothing was changed.`,'err');
      return;
    }
    if(!result.available.length){
      status(`No empty route rows remain for ${driver} on ${date}. Nothing was changed.`,'err');
      return;
    }

    const row=result.available[0];

    // Re-check the exact target C:E immediately before the update.
    const target=encodeURIComponent(`'${SHEET_NAME}'!C${row}:E${row}`);
    const check=await api(`/values/${target}?majorDimension=ROWS&valueRenderOption=UNFORMATTED_VALUE`);
    const existing=(check.values&&check.values[0])||[];
    if(String(existing[0]??'').trim() || String(existing[1]??'').trim() || String(existing[2]??'').trim()){
      status(`Row ${row} was filled by another update before submission. Nothing was changed — please tap Submit again.`,'err');
      return;
    }

    await writeEntry(row,leg,refs,areas);
    status('✓ Route saved successfully.','ok');
    resetEntryFields(); // Keep date and driver selected.
  }catch(e){
    console.error(e);
    status(e.message||String(e),'err');
  }finally{
    $('submit').disabled=false;
  }
};

window.addEventListener('load',waitForGoogle);
</script>
</body></html>
